<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Library</title>
    <link rel="stylesheet" href="library.css">
    <script src="library.js" defer></script>
    <link rel="shortcut icon" href="/" type="image/x-icon">
</head>

<body>

    <section class="lib-room">

        <nav>
            <span class="add-book">Add Book</span>
        </nav>
        <section class="book-library">

        </section>

        <dialog>
            <form>
                <div>
                    <label for="book-title">Enter Book Title:</label>
                    <input type="text" name="book-title" id="book-title" placeholder="Half Girlfriend">
                </div>
                <div>
                    <label for="book-author">Enter Book Author:</label>
                    <input type="text" name="book-author" id="book-author" placeholder="Chetan Bhagat">
                </div>
                <div>
                    <label for="book-page">Enter Number of Pages:</label>
                    <input type="number" name="book-pages" id="book-pages" placeholder="299">
                </div>
                <div>
                    <label for="book-read">
                        Book Read:
                        <input type="checkbox" name="checkbox" id="book-read" checked>
                    </label>
                </div>
                <input type="submit" value="Sumbit" id="submit-btn">
            </form>
        </dialog>
    </section>
</body>

</html>
